services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: sqlserver2022
    hostname: sqlserver2022
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "${MSSQL_PID}"
    ports:
      - "${MSSQL_PORT}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  sqlserver-init:
    image: mcr.microsoft.com/mssql-tools
    platform: linux/amd64
    container_name: sqlserver2022_init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_DATABASE: "${MSSQL_DATABASE}"
    volumes:
      - ./init:/init
    entrypoint: /bin/bash
    command: >
      -c "
      echo 'SQL Server está listo. Creando base de datos si no existe...';
      /opt/mssql-tools/bin/sqlcmd
      -S sqlserver
      -U sa
      -P "$${MSSQL_SA_PASSWORD}"
      -Q \"IF DB_ID(N'$${MSSQL_DATABASE}') IS NULL BEGIN CREATE DATABASE [$${MSSQL_DATABASE}] END\"
      -b;
      echo 'Proceso de creación de base de datos finalizado.';
      "
    restart: "no"

volumes:
  sqlserver_data:
